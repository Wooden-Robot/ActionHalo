name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify pinned toolchain
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
          swift --version | tee /dev/stderr | grep -Eq "Apple Swift version 6\.1([. ]|$)"

      - name: Run tests
        run: swift test

      - name: Run tests in parallel
        run: swift test --parallel

      - name: Enforce strict concurrency diagnostics
        run: swift build -Xswiftc -warn-concurrency -Xswiftc -warnings-as-errors -Xswiftc -enable-actor-data-race-checks

      - name: Build release executable
        run: swift build -c release

      - name: Install packaging tool
        run: brew install create-dmg

      - name: Smoke-test local package
        run: |
          make package
          test "$(lipo -archs .build/OpenFire)" = "x86_64 arm64"
          codesign --verify --deep --strict --verbose=2 .build/OpenFire.app
          hdiutil verify .build/OpenFire.dmg
