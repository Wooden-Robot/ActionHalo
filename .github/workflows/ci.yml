name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.4"

      - name: Verify pinned toolchain
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
          swift --version | tee /dev/stderr | grep -Eq "Apple Swift version 6\.1([. ]|$)"

      - name: Run tests
        run: swift test

      - name: Run tests with actor data-race checks
        run: swift test --parallel -Xswiftc -enable-actor-data-race-checks

      - name: Enforce strict concurrency diagnostics
        run: swift build -Xswiftc -warn-concurrency -Xswiftc -warnings-as-errors -Xswiftc -enable-actor-data-race-checks

      - name: Test release version gate
        run: bash Tests/verify_release_version_gate.sh

      - name: Test release entitlement gate
        run: bash Tests/verify_release_entitlements_gate.sh

      - name: Test Sparkle update gate
        run: bash Tests/verify_sparkle_update_gate.sh

      - name: Test GitHub Release gate
        run: bash Tests/verify_github_release_gate.sh

      - name: Test community release contract
        run: bash Tests/verify_community_release_contract.sh

      - name: Build release executable
        run: swift build -c release

      - name: Install packaging tool
        run: brew install create-dmg

      - name: Smoke-test local package
        run: |
          make package
          test "$(lipo -archs .build/ActionHalo)" = "x86_64 arm64"
          codesign --verify --deep --strict --verbose=2 .build/ActionHalo.app
          hdiutil verify .build/ActionHalo.dmg
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/App/Resources/Info.plist)"
          bash Tools/verify_release_dmg.sh \
            --dmg .build/ActionHalo.dmg \
            --version "$VERSION" \
            --info-plist Sources/App/Resources/Info.plist \
            --package-resolved Package.resolved

  thread-sanitizer:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.4"

      - name: Verify pinned toolchain
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
          swift --version | tee /dev/stderr | grep -Eq "Apple Swift version 6\.1([. ]|$)"

      - name: Run tests with Thread Sanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: swift test --sanitize thread
